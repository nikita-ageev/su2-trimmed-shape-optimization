% SU2 8.5 config template: supersonic wing-body half model, Euler, M = 1.7, fixed CL.
% Placeholders {..} are filled by scripts/driver.py (see Problem.cfg in driver.py).
SOLVER= EULER
MATH_PROBLEM= {MATH_PROBLEM}
RESTART_SOL= {RESTART_SOL}
READ_BINARY_RESTART= YES

% ----- free stream: M = 1.7 at ~17 km (ISA: p = 8850 Pa, T = 216.65 K)
MACH_NUMBER= 1.7
AOA= {AOA}
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 8850.0
FREESTREAM_TEMPERATURE= 216.65
REF_DIMENSIONALIZATION= DIMENSIONAL

% ----- fixed-CL mode: the angle of attack is driven to TARGET_CL; at the end of the direct run SU2 computes
% dCD/dCL and dCMy/dCL by a finite difference in AoA and stores them in flow.meta. The discrete adjoint then
% differentiates J - (dJ/dCL) * CL, i.e. the returned shape gradient is taken at constant lift.
FIXED_CL_MODE= YES
TARGET_CL= {TARGET_CL}
DCL_DALPHA= 0.035
UPDATE_AOA_ITER_LIMIT= 150
ITER_DCL_DALPHA= 250
EVAL_DOF_DCX= YES
DCD_DCL_VALUE= {DCD_DCL}
DCMY_DCL_VALUE= {DCMY_DCL}

% ----- reference values (half model): S/2 = 231 m2, MAC = 20.18 m; pitching moment about the centre of gravity
REF_ORIGIN_MOMENT_X= {XCG}
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 20.18
REF_AREA= 231.0

% ----- boundaries
MARKER_EULER= ( aircraft )
MARKER_SYM= ( symmetry )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( aircraft )
MARKER_MONITORING= ( aircraft )
MARKER_DESIGNING= ( aircraft )
OBJECTIVE_FUNCTION= {OBJ}

% ----- numerics
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 5.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.5, 5.0, 200.0 )
MGLEVEL= 0
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 0.05
LINEAR_SOLVER_ITER= 10
CONV_NUM_METHOD_FLOW= JST
JST_SENSOR_COEFF= ( 0.5, 0.02 )
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_REDUCTION_ADJFLOW= 0.8

% ----- convergence
ITER= {ITER}
CONV_FIELD= {CONV_FIELD}
CONV_RESIDUAL_MINVAL= {MINVAL}
CONV_STARTITER= 10

% ----- FFD box around the fuselage (8 corners x,y,z)
FFD_TOLERANCE= 1E-10
FFD_ITERATIONS= 500
FFD_DEFINITION= {FFD_DEF}
FFD_DEGREE= {FFD_DEG}
{FFD_BLEND}
FFD_CONTINUITY= USER_INPUT
FFD_FIX_J= ( {FFD_FIXJ} )
DV_MARKER= ( aircraft )
DV_KIND= {DV_KIND}
DV_PARAM= {DV_PARAM}
DV_VALUE= {DV_VALUE}

% ----- volume mesh deformation (linear elasticity)
DEFORM_LINEAR_SOLVER= FGMRES
DEFORM_LINEAR_SOLVER_PREC= ILU
DEFORM_LINEAR_SOLVER_ITER= 800
DEFORM_LINEAR_SOLVER_ERROR= 1E-9
DEFORM_NONLINEAR_ITER= {DEF_NL}
DEFORM_STIFFNESS_TYPE= WALL_DISTANCE
DEFORM_CONSOLE_OUTPUT= NO

% ----- files (paths must be relative and without spaces)
MESH_FILENAME= {MESH_IN}
MESH_FORMAT= SU2
MESH_OUT_FILENAME= {MESH_OUT}
SOLUTION_FILENAME= {SOLUTION}
SOLUTION_ADJ_FILENAME= solution_adj.dat
RESTART_FILENAME= {RESTART}
RESTART_ADJ_FILENAME= restart_adj.dat
TABULAR_FORMAT= CSV
CONV_FILENAME= {CONV_FILENAME}
VOLUME_FILENAME= flow
VOLUME_ADJ_FILENAME= adjoint
SURFACE_FILENAME= {SURFACE_FILENAME}
SURFACE_ADJ_FILENAME= {SURFACE_ADJ_FILENAME}
GRAD_OBJFUNC_FILENAME= {GRAD_FILENAME}
OUTPUT_FILES= {OUTPUT_FILES}
OUTPUT_WRT_FREQ= 100000
SCREEN_OUTPUT= {SCREEN_OUTPUT}
HISTORY_OUTPUT= {HISTORY_OUTPUT}
SCREEN_WRT_FREQ_INNER= 50
