name: tests
# unit tests that need no SU2: presets and Sobolev metric, smoothness metrics, DAKOTA driver, CadQuery route
# (the CAD and mesh parts skip themselves without cadquery / gmsh)
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy matplotlib
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile run.py scripts/*.py
